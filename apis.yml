name: Flock
description: >-
  Flock is a London-based commercial motor and fleet insurtech that provides
  usage-based, data-driven insurance for businesses operating vehicle fleets.
  Using real-time telematics and data science, Flock prices risk dynamically and
  rewards safer driving with lower premiums, delivering connected fleet insurance
  through a digital platform and partner integrations. The company is backed by
  Anthemis and other investors and operates primarily in the United Kingdom. This
  API Evangelist profile tracks Flock's public developer and company surface; as
  of this enrichment pass Flock publishes no public API, developer portal, or
  machine-readable specification.
